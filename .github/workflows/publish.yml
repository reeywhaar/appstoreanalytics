name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit on main should win the race for `latest` rather than queue behind an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/reeywhaar/appstoreanalytics

jobs:
  # Publishing `latest` on every push is safe only because a red build never gets past this.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # With no frontend build present: the bundle is read at startup, so a missing one is the
      # placeholder rather than a compile error.
      - run: go test ./...

      - uses: actions/setup-node@v7
        with:
          node-version: current
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v1
          build-args: VERSION=${{ github.sha }}
          provenance: false

      # By digest: exactly what this run pushed. A made-up key, so the sync fails against Apple
      # and everything else is the image as it ships.
      - name: Smoke-test the image
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -eu
          docker pull "$REF"
          key=$(openssl ecparam -genkey -name prime256v1 | openssl pkcs8 -topk8 -nocrypt | base64 | tr -d '\n')
          docker run -d --name smoke -p 8080:80 -v smoke:/data \
            -e APPSTOREANALYTICS_PUBLIC_URL=http://localhost:8080 \
            -e APPSTOREANALYTICS_USERNAME=smoke \
            -e APPSTOREANALYTICS_PASSWORD="a smoke-test password" \
            -e APPSTOREANALYTICS_ISSUER_ID=00000000-0000-0000-0000-000000000000 \
            -e APPSTOREANALYTICS_KEY_ID=SMOKE00000 \
            -e APPSTOREANALYTICS_PRIVATE_KEY_BASE64="$key" \
            "$REF"
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz | grep -q '"ok":true'
          curl -sS http://localhost:8080/api/nope | grep -q '"ok":false'
          curl -fsS http://localhost:8080/login | grep -q 'id="root"'
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"username":"smoke","password":"a smoke-test password"}' \
            http://localhost:8080/api/auth/login
          curl -fsS -b jar http://localhost:8080/ | grep -q 'id="root"'
          curl -fsS -b jar http://localhost:8080/api/status | grep -q '"analytics"'


  # A job of its own rather than steps on `publish`, because a failing `test` *skips*
  # `publish` rather than failing it, and a step in a job that never starts cannot report
  # that it never started. This one runs either way and reads the results off `needs`.
  notify:
    needs: [test, publish]
    # Not always(): cancel-in-progress means a newer push kills the run in flight, and being
    # told that a commit you just superseded was cancelled is noise.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}

    # The secrets context is not available to `if`, so the presence check goes through env.
    # Without this, a repo that has not set the secrets yet gets a red run on every push —
    # a broken notifier should not look like a broken build.
    env:
      NOTIFIO_HOST: ${{ secrets.NOTIFIO_HOST }}
      NOTIFIO_TOKEN: ${{ secrets.NOTIFIO_TOKEN }}
      CONFIGURED: ${{ secrets.NOTIFIO_HOST != '' && secrets.NOTIFIO_TOKEN != '' }}

    steps:
      - name: Notify on success
        if: ${{ env.CONFIGURED == 'true' && needs.publish.result == 'success' }}
        uses: reeywhaar/notifio/ghactions/notify@main
        with:
          host: ${{ env.NOTIFIO_HOST }}
          token: ${{ env.NOTIFIO_TOKEN }}
          subject: "${{ github.repository }} published"
          body-type: md
          body: |
            📊 Published `${{ env.IMAGE }}:latest` and `:v1`

            - by ${{ github.actor }}
            - [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

      - name: Notify on failure
        if: ${{ env.CONFIGURED == 'true' && needs.publish.result != 'success' }}
        uses: reeywhaar/notifio/ghactions/notify@main
        with:
          host: ${{ env.NOTIFIO_HOST }}
          token: ${{ env.NOTIFIO_TOKEN }}
          # Which half broke is the first thing worth knowing: a failing test means the
          # commit is bad, a failing publish means the commit is fine and the build is not.
          subject: "${{ github.repository }} ${{ needs.test.result != 'success' && 'tests failed' || 'publish failed' }}"
          body-type: md
          body: |
            ❌ ${{ needs.test.result != 'success' && 'Tests failed' || 'Publish failed' }}, by ${{ github.actor }}

            - [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - [view the run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
